name: Release PUNY4 Calculator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.1 (the tag v<version> will be created)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${INPUT_VERSION#v}"
          fi
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$VERSION' is not a valid version (expected e.g. 1.0.1)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION, build ${{ github.run_number }})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"

          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD_SECRET" && -n "$KEY_PASSWORD_SECRET" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$STORE_PASSWORD_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            echo "mode=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not set. Generating a temporary key; this APK cannot be installed as an update over a build signed with a different key."
            STORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PUNY4 Calculator,O=PUNY4,C=US"
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          gradle --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ github.run_number }}"

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          test -f "$APK" || { echo "ERROR: release APK not found."; exit 1; }

          OUT="dist/PUNY4-Calculator-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -l dist
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUNY4-Calculator-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          ARGS=(--title "PUNY4 Calculator $TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ "$SIGNING_MODE" == "temporary" ]]; then
            ARGS+=(--notes "Signed with a temporary key (repository signing secrets are not configured).")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${ARGS[@]}"
          fi
