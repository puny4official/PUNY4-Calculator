
name: Build PUNY4 Calculator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle Wrapper
        id: wrapper
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found."
            echo "Check that the Gradle Wrapper files are committed to GitHub."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$WRAPPER"
          echo "Gradle Wrapper found: $WRAPPER"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.wrapper.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.wrapper.outputs.project_dir }}"
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUNY4-Calculator-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          
